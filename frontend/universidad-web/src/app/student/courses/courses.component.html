<div class="container">
  <h2>Mis Cursos</h2>
  
  <div class="card shadow">
  @if (cursos.length > 0) {
    <ul class="list-group">
      @for (matricula of cursos; track matricula.id) {
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <h5>{{ matricula.curso.nombre }}</h5>
            <p>{{ matricula.curso.descripcion }}</p>
          </div>
          <button class="btn btn-danger btn-sm" (click)="removeEnrollment(matricula.curso.id)">
            Darse de baja
          </button>
        </li>
      }
    </ul>
  } @else {
    <p>No estás inscrito en ningún curso.</p>
  }
</div>
</div>
