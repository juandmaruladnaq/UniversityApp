<div class="container">
  <h2>Inscribirme en un Curso</h2>
  <div class="card shadow">
  @if (cursos.length > 0) {
  <ul class="list-group">
    @for (curso of cursos; track curso.id) {
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <h5>{{ curso.nombre }}</h5>
        <p>{{ curso.descripcion }}</p>
      </div>
      <div class="flex gap-2.5">
        <button class="btn btn-sm" (click)="openViewModal(curso.id)">
          <a class="view"><i class="fa-solid fa-eye"></i></a>
        </button>
        <button class="btn btn-primary" (click)="inscribirse(curso.id)">
          Inscribirme
        </button>
      </div>
    </li>
    }
  </ul>
  } @else {
  <p>No hay cursos disponibles.</p>
  }
  </div>
</div>
